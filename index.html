<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070A0E">
<meta name="robots" content="noindex">
<title>DietCokeMan Challenge</title>
<meta property="og:title" content="DietCokeMan Challenge">
<meta property="og:description" content="Ice-cold fantasy football trivia. How many can you name before the clock runs out?">
<meta property="og:type" content="website">
<meta property="og:image" content="https://challenge.dietcokeman.com/assets/football-ice.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap">
<link rel="stylesheet" href="style.css?v=20261123175327">
<link rel="icon" type="image/png" href="assets/frosted-can-icon.png">
<!-- Start fetching Firebase while the page loads, so your bests show sooner (account.js) -->
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js" crossorigin>
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js" crossorigin>
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <a class="brand" href="index.html">
      <img class="mark" src="assets/frosted-can-icon.png" width="34" height="34" alt="">
      <span style="display:block">
        <b>DietCokeMan</b>
        <span>Challenge</span>
      </span>
    </a>
    <div class="spacer"></div>
    <a class="ghost acct" id="acct" href="profile.html" hidden>Sign in</a>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <div class="heroshot" role="img"
         aria-label="A frosted Diet Coke can buried in ice beside a football"></div>
    <div class="herotext">
      <h1>DietCokeMan <em>Challenge</em></h1>
      <p>Ice-cold refreshing quizzes and trivia.</p>
    </div>
  </section>

  <!-- Time-sensitive quizzes (featured: true) get their own section above the
       evergreen ones. It steps aside while you search or filter. -->
  <section class="featured" id="featured" hidden>
    <div class="sect-h"><h2>This week</h2></div>
    <div class="feature-grid" id="featureGrid"></div>
  </section>

  <div class="sect-h"><h2>Pick your challenge</h2></div>
  <!-- Search and filters. Always on (Steven: "Show it now"). -->
  <div class="finder" id="finder" hidden>
    <input class="find" id="find" type="search" placeholder="Search quizzes" autocomplete="off"
           spellcheck="false" aria-label="Search quizzes">
    <div class="facets" id="facets"></div>
  </div>
  <div class="grid" id="grid"></div>
  <p class="nomatch" id="nomatch" hidden>No quizzes match. <button type="button" class="linkbtn" id="clear">Show all</button></p>

  <p style="text-align:center;color:#6C7A8A;font-size:12.5px;margin:48px 0 40px">
    Scores stay on your own device<br>
    An independent fan project — not affiliated with, sponsored by, or endorsed by any beverage company.
  </p>
</main>

<script type="module" src="account.js?v=20261123175327"></script>
<script src="quizzes.js?v=20261123175327"></script>
<script>
(function(){
  const $ = (id) => document.getElementById(id);
  const grid = $('grid');
  const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const norm = (s) => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  // Hub order (Steven): Best Drink and his Favorite Movies stay on top (`pin`),
  // then quizzes grouped by sport (all football, then basketball, baseball,
  // hockey, golf), then everything else by category in TAXONOMY order. Within
  // a group, quizzes.js order holds, so a new quiz lands with its own kind.
  const SPORTS = ['Football', 'Basketball', 'Baseball', 'Hockey', 'Golf'];
  const groupOf = (q) => {
    if (q.pin) return 0;
    const sport = SPORTS.findIndex(t => (q.tags || []).includes(t));
    if (sport >= 0) return 1 + sport;
    const cat = ((window.TAXONOMY || {}).categories || []).indexOf(q.category);
    return 1 + SPORTS.length + (cat >= 0 ? cat : 99);
  };
  const QUIZZES = (window.QUIZZES || []).map((q, i) => [groupOf(q), i, q])
    .sort((a, b) => a[0] - b[0] || a[1] - b[1]).map(x => x[2]);
  const TAX = window.TAXONOMY || { categories: [], tags: {} };
  const allTags = Object.values(TAX.tags).flat();

  // The taxonomy is the contract; say so loudly while building quizzes.
  QUIZZES.forEach(q => {
    if (!TAX.categories.includes(q.category)) console.warn('Quiz', q.slug, 'has an unknown category:', q.category);
    (q.tags || []).forEach(t => { if (!allTags.includes(t)) console.warn('Quiz', q.slug, 'has an unknown tag:', t); });
    if (!(q.tags || []).length) console.warn('Quiz', q.slug, 'has no tags');
  });

  const params = new URLSearchParams(location.search);
  const state = { q: params.get('q') || '', category: params.get('category') || '', tag: params.get('tag') || '' };
  const finderOn = true;   // Steven: "Show it now" — always on, even with a handful of quizzes

  // Words typed in the box must all appear somewhere in a quiz's title,
  // subtitle, blurb, category or tags. Answers are never searched: that
  // would tell you who is on the board.
  const hay = (q) => norm([q.title, q.sub, q.blurb, q.category, ...(q.tags || [])].join(' '));
  function matches(q) {
    if (state.category && q.category !== state.category) return false;
    if (state.tag && !(q.tags || []).includes(state.tag)) return false;
    const words = norm(state.q).split(/\s+/).filter(Boolean);
    const h = hay(q);
    return words.every(w => h.includes(w));
  }

  const ICONS = TAX.icons || { tags: {}, categories: {} };
  const iconFor = (q) => q.icon
    || ((q.tags || []).map(t => ICONS.tags[t]).find(Boolean))
    || ICONS.categories[q.category] || '';

  // Signed in, account.js hands over your saved bests (board id -> {best,total});
  // a card shows the higher of its two modes. Signed out, nothing is shown.
  let bests = window._dcmBests || null;
  window.addEventListener('dcm:bests', (e) => { bests = e.detail; render(); });
  function bestFor(q) {
    if (!bests) return null;
    const key = q.scoreKey || q.slug;
    const runs = ['timed', 'chill'].map(m => bests[key + '-' + m]).filter(Boolean);
    return runs.length ? runs.reduce((a, b) => (b.best / b.total > a.best / a.total ? b : a)) : null;
  }

  // Title, subtitle, one small emoji in the corner, and your best if you're signed in.
  const card = (q, cls) => {
    const b = bestFor(q);
    const best = b ? `<span class="card-best${b.best >= b.total ? ' full' : ''}" title="Your best">${b.best}/${b.total}</span>` : '';
    return `<a class="card${cls ? ' ' + cls : ''}${b ? ' has-best' : ''}" href="play.html?q=${encodeURIComponent(q.slug)}">
      <span class="card-ico" aria-hidden="true">${esc(iconFor(q))}</span>
      <h3>${esc(q.title)}</h3>
      <div class="sub">${esc(q.sub)}</div>
      ${cls && q.blurb ? `<p class="blurb">${esc(q.blurb)}</p>` : ''}
      ${best}
    </a>`;
  };

  function render() {
    // Featured (weekly, time-sensitive) quizzes sit in "This week" until you
    // search or filter; then everything is just results in one grid.
    const browsing = !state.q && !state.category && !state.tag;
    const featured = browsing ? QUIZZES.filter(q => q.featured) : [];
    $('featured').hidden = !featured.length;
    $('featureGrid').innerHTML = featured.map(q => card(q, 'feature')).join('');
    const shown = QUIZZES.filter(q => matches(q) && !featured.includes(q));
    grid.innerHTML = shown.map(q => card(q)).join('');
    $('nomatch').hidden = shown.length + featured.length > 0;
    if (finderOn) paintFacets();
  }

  // Only categories and tags that some quiz actually uses, in taxonomy order.
  function paintFacets() {
    const used = (list, key) => list.filter(v => QUIZZES.some(q => key === 'category' ? q.category === v : (q.tags || []).includes(v)));
    const cats = used(TAX.categories, 'category');
    const tags = used(allTags, 'tag');
    const btn = (key, v, label) => `<button type="button" class="facet" data-k="${key}" data-v="${esc(v)}"
      aria-pressed="${state[key] === v}">${esc(label)}</button>`;
    $('facets').innerHTML =
      (cats.length > 1 ? `<div class="facet-row">${btn('category', '', 'All')}${cats.map(c => btn('category', c, c)).join('')}</div>` : '') +
      `<div class="facet-row">${btn('tag', '', 'Everything')}${tags.map(t => btn('tag', t, t)).join('')}</div>`;
  }

  function sync() {
    const p = new URLSearchParams();
    ['q', 'category', 'tag'].forEach(k => { if (state[k]) p.set(k, state[k]); });
    history.replaceState(null, '', location.pathname + (p.toString() ? '?' + p : ''));
    render();
  }

  if (finderOn) {
    $('finder').hidden = false;
    $('find').value = state.q;
    $('find').addEventListener('input', (e) => { state.q = e.target.value; sync(); });
    $('facets').addEventListener('click', (e) => {
      const b = e.target.closest('.facet');
      if (!b) return;
      state[b.dataset.k] = b.dataset.v;
      sync();
    });
  }
  $('clear').addEventListener('click', () => { state.q = state.category = state.tag = ''; $('find').value = ''; sync(); });
  render();
})();
</script>
</body>
</html>
