<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070A0E">
<meta name="robots" content="noindex">
<title>DietCokeMan Challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23F01932'/><rect x='34' y='18' width='32' height='64' rx='9' fill='%23E8EDF2'/></svg>">
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <a class="brand" href="index.html">
      <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
        <defs>
          <linearGradient id="cn" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#F7FAFD"/><stop offset=".45" stop-color="#C3CEDA"/>
            <stop offset=".55" stop-color="#EDF3F8"/><stop offset="1" stop-color="#9AA8B6"/>
          </linearGradient>
        </defs>
        <rect x="18" y="6" width="28" height="52" rx="8" fill="url(#cn)"/>
        <rect x="18" y="24" width="28" height="15" fill="#F01932"/>
        <rect x="18" y="6" width="7" height="52" rx="8" fill="#fff" opacity=".35"/>
        <circle cx="51" cy="15" r="4" fill="#7FD9F7" opacity=".85"/>
        <circle cx="57" cy="26" r="2.6" fill="#7FD9F7" opacity=".6"/>
        <circle cx="50" cy="35" r="2" fill="#7FD9F7" opacity=".5"/>
      </svg>
      <span style="display:block">
        <b>DietCokeMan</b>
        <span>Challenge</span>
      </span>
    </a>
    <div class="spacer"></div>
    <a class="ghost" href="index.html">All quizzes</a>
  </div>
</header>

<main class="wrap">

  <!-- ============ START ============ -->
  <section id="start" class="start">
    <h1 id="qTitle">—</h1>
    <p class="sub" id="qSub">—</p>
    <p class="sub" id="qBlurb" style="margin-top:-16px"></p>

    <div class="modes">
      <button class="mode" data-m="timed" aria-pressed="false">
        <b>Timed</b><small><span id="mTime">5:00</span> on the clock</small>
      </button>
      <button class="mode" data-m="lives" aria-pressed="false">
        <b>Survival</b><small><span id="mLives">10</span> wrong and you're out</small>
      </button>
      <button class="mode" data-m="chill" aria-pressed="false">
        <b>No pressure</b><small>Take as long as you like</small>
      </button>
    </div>

    <button class="btn" id="go">
      Start — <span id="qCount">0</span> to find
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
    <p class="pct" id="bestLine" style="min-height:18px"></p>

    <p class="fine">First or last name — either one counts · spelling is forgiving ·
      answers fill as you type · Enter only costs you on a miss</p>
  </section>

  <!-- ============ GAME ============ -->
  <section id="game" hidden>
    <div class="hud">
      <div class="wrap" style="width:100%">
        <div class="hudrow">
          <form id="form" style="display:contents" autocomplete="off">
            <input id="guess" class="guess" type="text" placeholder="Type a name…"
                   autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
                   enterkeyhint="done" aria-label="Type your guess">
          </form>
          <div class="stats">
            <div class="stat"><b><span id="sc">0</span><span id="scTot" style="font-size:13px;color:#8A97A6">/0</span></b><small>Found</small></div>
            <div class="stat" id="statRight"><b>—</b><small>&nbsp;</small></div>
          </div>
        </div>
        <div class="pbar"><i id="pbar"></i></div>
        <div class="toast" id="toast"></div>
      </div>
    </div>

    <h2 id="hudTitle" style="font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:#8A97A6;margin:22px 0 0;font-weight:800"></h2>
    <div id="board" class="board"></div>
    <div style="text-align:center;margin:0 0 56px">
      <button class="ghost" id="giveup">Give up &amp; reveal</button>
    </div>
  </section>
</main>

<!-- ============ RESULT ============ -->
<div class="scrim" id="scrim">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <h2 id="mTitle">Time!</h2>
    <p class="verdict" id="mVerdict">—</p>
    <div class="bigscore" id="mScore">0<small>/0</small></div>
    <p class="pct" id="mPct"></p>
    <div class="statline" id="mStats"></div>
    <button class="btn" id="again">Play again</button>
    <button class="btn sec" id="copy">Copy my result</button>
    <p style="margin:16px 0 0"><a class="ghost" href="index.html">← All quizzes</a></p>
  </div>
</div>

<script src="quizzes.js"></script>
<script src="engine.js"></script>
</body>
</html>
