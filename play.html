<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070A0E">
<meta name="robots" content="noindex">
<title>DietCokeMan Challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap">
<link rel="stylesheet" href="style.css?v=20261117092131">
<link rel="icon" type="image/png" href="assets/frosted-can-icon.png">
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <a class="brand" href="index.html">
      <img class="mark" src="assets/frosted-can-icon.png" width="34" height="34" alt="">
      <span style="display:block">
        <b>DietCokeMan</b>
        <span>Challenge</span>
      </span>
    </a>
    <div class="spacer"></div>
    <a class="ghost" href="index.html">All quizzes</a>
  </div>
</header>

<main class="wrap">

  <section class="qintro">
    <h1 id="qTitle">—</h1>
    <p class="qsub" id="qSub">—</p>
    <p class="bestline" id="bestLine"></p>
  </section>

  <!-- One sticky bar. The board is already on screen behind it, so the bar only
       swaps its left half: pick-a-mode-and-start before the run, the guess box
       during it. The score and clock never move. -->
  <div class="hud">
    <div class="wrap">
      <div class="hudrow">

        <div class="pre" id="pre">
          <div class="modes">
            <button class="mode" data-m="timed" aria-pressed="false">
              <b>Timed</b><small id="mTime">5:00</small>
            </button>
            <button class="mode" data-m="lives" aria-pressed="false">
              <b>Survival</b><small><span id="mLives">10</span> wrong</small>
            </button>
            <button class="mode" data-m="chill" aria-pressed="false">
              <b>No pressure</b><small>no limit</small>
            </button>
          </div>
          <button class="btn go" id="go">
            Play quiz
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </button>
        </div>

        <form class="live" id="live" autocomplete="off" hidden>
          <input id="guess" class="guess" type="text" placeholder="Type a name…"
                 autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
                 enterkeyhint="done" aria-label="Type your guess">
        </form>

        <div class="stats">
          <div class="stat"><b><span id="sc">0</span><span id="scTot">/0</span></b><small>Found</small></div>
          <div class="stat" id="statRight"><b>—</b><small>&nbsp;</small></div>
        </div>

      </div>
      <div class="pbar"><i id="pbar"></i></div>
      <div class="toast" id="toast"></div>
    </div>
  </div>

  <div id="board" class="board"></div>

  <div style="text-align:center;margin:0 0 10px">
    <button class="ghost" id="giveup" hidden>Give up &amp; reveal</button>
  </div>

  <p class="fine">First or last name — either one counts · a shared name fills everyone who has it ·
    spelling is forgiving · answers fill as you type · Enter only costs you on a miss</p>
</main>

<!-- ============ RESULT ============ -->
<div class="scrim" id="scrim">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <button class="mclose" id="mclose" aria-label="Close and see the board" title="Close">&times;</button>
    <h2 id="mTitle">Time!</h2>
    <p class="verdict" id="mVerdict">—</p>
    <div class="bigscore" id="mScore">0<small>/0</small></div>
    <p class="pct" id="mPct"></p>
    <div class="statline" id="mStats"></div>
    <button class="btn sec" id="review">See what I missed</button>
    <button class="btn" id="again">Play again</button>
    <button class="btn sec" id="copy">Copy my result</button>
    <p style="margin:16px 0 0"><a class="ghost" href="index.html">← All quizzes</a></p>
  </div>
</div>

<script src="quizzes.js?v=20261117092131"></script>
<script src="engine.js?v=20261117092131"></script>
</body>
</html>
